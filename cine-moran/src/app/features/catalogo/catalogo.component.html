<header>
  <h1>Cartelera</h1>
</header>

<div class="filtros">
  <input
    type="text"
    placeholder="Buscar película..."
    [value]="busqueda()"
    (input)="onBusquedaChange($any($event.target).value)"
  />

  <select [value]="generoSeleccionado() ?? ''" (change)="onGeneroChange($any($event.target).value)">
    <option value="">Todos los géneros</option>
    @for (genero of generosDisponibles(); track genero) {
      <option [value]="genero">{{ genero }}</option>
    }
  </select>
</div>

@if (cargando()) {
  <p>Cargando cartelera...</p>
} @else if (peliculasFiltradas().length === 0) {
  <p>No se encontraron películas.</p>
} @else {
  <div class="grid-peliculas">
    @for (pelicula of peliculasFiltradas(); track pelicula.id) {
      <app-tarjeta-pelicula [pelicula]="pelicula" [puestoVentas]="puestosVentas().get(pelicula.id) ?? null" />
    }
  </div>
}
