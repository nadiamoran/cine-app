<div class="admin-layout">
  <aside class="admin-menu">
    <!-- exact: "Inicio" (/admin) solo se marca en el panel, no en las pantallas hijas -->
    <a routerLink="/admin" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>

    @for (grupo of grupos; track grupo.titulo) {
      <span class="admin-menu-grupo">{{ grupo.titulo }}</span>
      @for (link of grupo.links; track link.ruta) {
        <a [routerLink]="link.ruta" routerLinkActive="activo">{{ link.texto }}</a>
      }
    }
  </aside>

  <!-- acá se carga la pantalla de admin elegida -->
  <section class="admin-contenido">
    <router-outlet />
  </section>
</div>
