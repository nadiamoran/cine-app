<form novalidate [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <h1>Ingresar</h1>

  <label>
    Email
    <input type="email" formControlName="email" />
    @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
      @if (loginForm.controls.email.errors?.['required']) {
        <small class="error">El email es obligatorio</small>
      } @else if (loginForm.controls.email.errors?.['email']) {
        <small class="error">El email no es válido</small>
      }
    }
  </label>

  <label>
    Contraseña
    <input type="password" formControlName="password" />
    @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
      <small class="error">La contraseña es obligatoria</small>
    }
  </label>

  @if (errorMsg()) {
    <p class="error">{{ errorMsg() }}</p>
  }

  <button type="submit" [disabled]="loading()">
    {{ loading() ? 'Ingresando...' : 'Ingresar' }}
  </button>

  <p>¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
</form>
